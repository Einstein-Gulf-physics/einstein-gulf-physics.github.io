<html lang="en" dir="ltr">

<title>Review (1) · Torque and Equilibrium</title>
<style>
:root{--ink:#14213d;--muted:#5c6475;--line:#d6dbe4;--accent:#0b5d8f;--ok:#1e7d3a;--bad:#b3261e;--bg:#f4f6f9;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 40px}
header{text-align:center;padding:10px 0 6px}
header .p{font-weight:bold;font-size:19px;color:var(--accent)}
header .t{font-weight:bold;font-size:18px}
header .k{font-size:15px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;position:relative;overflow:hidden}
h2{font-size:17px;margin:0 0 8px}
ol.ins{margin:0;padding-inline-start:22px} ol.ins li{margin:3px 0;font-size:15.5px}
label{display:block;font-weight:bold;margin:12px 0 4px}
input[type=text],input[type=tel]{width:100%;padding:11px 12px;font-size:17px;border:1px solid #9aa3b2;border-radius:8px;font-family:inherit}
button{font-family:inherit;font-size:17px;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
.btn{background:var(--accent);color:#fff;width:100%;margin-top:14px;font-weight:bold}
.btn.wa{background:#1f8f4e}.btn.sec{background:#e8ecf2;color:var(--ink)}
.err{color:var(--bad);font-weight:bold;min-height:1.4em;margin-top:6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qn{font-weight:bold}
.timer{font-weight:bold;font-variant-numeric:tabular-nums;border:2px solid var(--accent);color:var(--accent);border-radius:8px;padding:2px 10px;direction:ltr}
.timer.low{border-color:var(--bad);color:var(--bad)}
.prog{height:6px;background:#e3e7ee;border-radius:3px;margin:8px 0 2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.qtext{margin:10px 0}
.fig{text-align:center;margin:8px 0}
.fig svg{max-width:100%;height:auto}
.opts{display:grid;gap:9px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;text-align:start;width:100%;color:var(--ink)}
.opt .l{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #8c96a8;display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:Arial,sans-serif}
.opt.sel{border-color:var(--accent);background:#eaf3f9}.opt.sel .l{background:var(--accent);border-color:var(--accent);color:#fff}
.wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.wm span{position:absolute;white-space:nowrap;font-size:20px;font-weight:bold;color:rgba(20,33,61,.07);transform:rotate(-28deg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--bad);color:#fff;padding:10px 14px;border-radius:8px;max-width:92%;font-size:15px;z-index:20;display:none;text-align:center}
.score{text-align:center;font-size:44px;font-weight:bold;color:var(--accent);direction:ltr}
.note{font-size:14.5px;color:var(--muted);margin-top:8px}.okc{color:var(--ok);font-weight:bold}.badc{color:var(--bad);font-weight:bold}
.hide{display:none}
bdi{white-space:nowrap}
</style>
</head>

(function(){
"use strict";
const T=CFG.t, RTL=CFG.rtl, KEY='egp_'+CFG.exam;
const $=s=>document.querySelector(s), app=$('#app');
$('#hp').textContent=CFG.platform; $('#ht').textContent=CFG.title; $('#hk').textContent=CFG.track;

// ---------- storage (safe) ----------
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function deviceCode(){let d=sget('egp_device');if(!d){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';d='';const r=new Uint32Array(6);(window.crypto||window.msCrypto).getRandomValues(r);for(let i=0;i<6;i++)d+=c[r[i]%c.length];sset('egp_device',d)}return d}
// ---------- verification hash (same function in teacher dashboard) ----------
function vhash(s){let h1=0x811c9dc5,h2=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0}return((h1^h2)>>>0).toString(16).toUpperCase().padStart(8,'0').slice(0,6)}
function isOk(q,a){return vhash(CFG.salt+'|'+q.id+'|'+q.opts[a])===q.ah}
async function sheetTaken(name){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),7000);const r=await fetch(CFG.sheet+'?exam='+encodeURIComponent(CFG.sheetTitle)+'&name='+encodeURIComponent(name),{signal:c.signal});clearTimeout(t);const j=await r.json();return !!j.taken}catch(e){return null}}
function sheetMsg(k){const el=$('#sm');if(!el)return;el.textContent=T.sheet[k]||'';el.className='note '+((k==='ok'||k==='maybe')?'okc':(k==='wait'?'':'badc'))}
function sendSheet(){if(!S||!S.done||!S.result)return;if(S.sent){sheetMsg(S.sent);return}sheetMsg('wait');
 const body=JSON.stringify({exam:CFG.sheetTitle,name:S.name.trim().replace(/\s+/g,' '),score:S.result.score,total:S.result.n,exits:S.exits,dev:S.dev,vcode:S.result.sig,answers:''});
 fetch(CFG.sheet,{method:'POST',body:body}).then(r=>r.json()).then(j=>{S.sent=(j&&j.status==='dup')?'dup':'ok';save();sheetMsg(S.sent)})
 .catch(()=>{fetch(CFG.sheet,{method:'POST',mode:'no-cors',body:body}).then(()=>{S.sent='maybe';save();sheetMsg('maybe')}).catch(()=>sheetMsg('fail'))})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function iso(s){ // keep numbers+units together and direction-safe
  return esc(s).replace(/(-?[\d.]+\s?(?:N·m|N|cm|kg|m\/s²|m)|g = 9\.8 m\/s²|\b[FLd][₁₂]?(?![\w₁₂])|\bO\b|\b[AB]\b)/g,'<bdi dir="ltr">$1</bdi>')}
function shuffle(a){a=a.slice();const r=new Uint32Array(a.length);crypto.getRandomValues(r);for(let i=a.length-1;i>0;i--){const j=r[i]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',4000)}
['copy','cut','paste','selectstart','dragstart'].forEach(e=>document.addEventListener(e,ev=>{if(!(ev.target&&ev.target.tagName==='INPUT'))ev.preventDefault()}));

// ---------- state ----------
let S=null;
function save(){sset(KEY,JSON.stringify(S))}
function load(){try{return JSON.parse(sget(KEY)||'null')}catch(e){return null}}

// ---------- result message ----------
function buildResult(){
  const n=CFG.qs.length;let score=0;const lines=[],parts=[];
  CFG.qs.forEach(q=>{const a=S.ans[q.id];const sec=S.time[q.id]||0;let st,txt;
    if(a===undefined||a===null){st='-';txt='⛔ '+T.mNoAns}
    else{const ok=isOk(q,a);if(ok)score++;st=ok?'1':'0';txt=(ok?'✅ ':'❌ ')+q.opts[a]}
    lines.push(q.tag+': '+txt+' ⏱ '+sec+T.sec);parts.push(q.id+':'+st+':'+sec)});
  const name=S.name.trim().replace(/\s+/g,' ');
  const sig=vhash([CFG.salt,CFG.exam,name,score,n,S.exits,S.reopen?1:0,S.dev,parts.join(',')].join('|'));
  const msg=[CFG.platform,CFG.title,CFG.trackLine,T.mName+': '+name,T.mScore+': '+score+' / '+n].concat(lines)
   .concat(S.reopen?[T.mReopen]:[]).concat([T.mExits+': '+S.exits,T.mDevice+': '+S.dev,T.mVerify+': '+sig]).join('\n');
  return {score,n,msg,sig}
}

// ---------- screens ----------
function startScreen(){
  app.innerHTML=`<div class="card"><h2>${esc(T.instrTitle)}</h2><ol class="ins">${T.instr.map(x=>'<li>'+iso(x)+'</li>').join('')}</ol></div>
  <div class="card"><label for="nm">${esc(T.name)}</label><input id="nm" type="text" autocomplete="off" placeholder="${esc(T.namePh)}">
  <label for="cd">${esc(T.code)}</label><input id="cd" type="tel" inputmode="numeric" autocomplete="off" placeholder="${esc(T.codePh)}">
  <div class="err" id="er"></div><button class="btn" id="go">${esc(T.start)}</button></div>`;
  $('#go').onclick=async()=>{const nm=$('#nm').value.trim().replace(/\s+/g,' '),cd=$('#cd').value.trim();
    if(nm.length<3){$('#er').textContent=T.needName;return}
    if(vhash(CFG.salt+'|code|'+cd)!==CFG.codeH){$('#er').textContent=T.badCode;return}
    const gb=$('#go');gb.disabled=true;$('#er').textContent=T.checking;const tk=await sheetTaken(nm);gb.disabled=false;$('#er').textContent='';
    if(tk){$('#er').textContent=T.taken;return}
    S={name:nm,dev:deviceCode(),order:shuffle(CFG.qs.map((q,i)=>i)),optOrder:{},ans:{},time:{},cur:0,exits:0,reopen:false,done:false,started:Date.now(),qStart:Date.now()};
    CFG.qs.forEach(q=>S.optOrder[q.id]=shuffle([0,1,2,3]));
    save();try{history.pushState(null,'',location.href)}catch(e){}
    showQ()}
}
let tick=null,sel=null;
function wm(name){let h='';for(let r=0;r<9;r++)for(let c=0;c<3;c++)h+=`<span style="top:${r*13-4}%;left:${c*38-12+(r%2)*16}%">${esc(name)}</span>`;return `<div class="wm">${h}</div>`}
function showQ(){
  clearInterval(tick);
  if(S.cur>=CFG.qs.length)return finish();
  const q=CFG.qs[S.order[S.cur]],n=CFG.qs.length,L='ABCD';sel=null;
  if(!S.qStart)S.qStart=Date.now();
  const deadline=S.qStart+q.sec*1000;
  app.innerHTML=`<div class="card">${wm(S.name)}
   <div class="bar"><span class="qn">${esc(T.qof.replace('{i}',S.cur+1).replace('{n}',n))}</span><span class="timer" id="tm" title="${esc(T.timeLeft)}">5:00</span></div>
   <div class="prog"><i style="width:${S.cur/n*100}%"></i></div>
   <div class="qtext">${iso(q.text)}</div><div class="fig">${q.svg}</div>
   <div class="opts">${S.optOrder[q.id].map((oi,k)=>`<button class="opt" data-o="${oi}"><span class="l">${L[k]}</span><span>${iso(q.opts[oi])}</span></button>`).join('')}</div>
   <button class="btn" id="nx">${esc(S.cur===n-1?T.finish:T.next)}</button></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.o});
  $('#nx').onclick=()=>{if(sel===null&&!confirm(T.confirmNext))return;next(q)};
  const upd=()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));const tm=$('#tm');if(!tm)return;
    tm.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');tm.classList.toggle('low',left<=60);
    if(left<=0)next(q)};
  upd();tick=setInterval(upd,500);window.scrollTo(0,0);
}
function next(q){
  clearInterval(tick);
  S.time[q.id]=Math.min(q.sec,Math.round((Date.now()-S.qStart)/1000));
  if(sel!==null)S.ans[q.id]=sel;
  S.cur++;S.qStart=Date.now();save();showQ();
}
function finish(){
  clearInterval(tick);S.done=true;const r=buildResult();S.result=r;save();resultScreen(r,false)}
function resultScreen(r,locked){
  const wa='https://wa.me/'+CFG.phone+'?text='+encodeURIComponent(r.msg);
  app.innerHTML=`<div class="card">${locked?`<p class="err">${esc(T.locked)}</p><p>${esc(T.lockedHasResult)}</p>`:`<h2 style="text-align:center">${esc(T.doneTitle)}</h2>`}
   <div style="text-align:center">${esc(T.score)}</div><div class="score">${r.score} / ${r.n}</div><p class="note" id="sm"></p>
   <a href="${wa}" target="_blank" rel="noopener"><button class="btn wa">${esc(T.send)}</button></a>
   <button class="btn sec" id="cp">${esc(T.copy)}</button>
   <p class="note">${iso(T.copyHelp)}<br>${esc(T.noEdit)}</p>
   ${typeof PDF_B64!=='undefined'?`<button class="btn sec" id="dl">${esc(T.pdf)}</button><p class="note">${esc(T.pdfNote)}</p>`:''}
  </div>`;
  $('#cp').onclick=()=>copyText(r.msg);
  const dl=$('#dl');if(dl)dl.onclick=downloadPdf;
  setTimeout(sendSheet,50);
}
function copyText(s){const done=()=>toast(T.copied);
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(done,()=>fallback())}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)}}
function downloadPdf(){
  const bin=atob(PDF_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const blob=new Blob([u],{type:'application/pdf'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=PDF_NAME;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},4000)}

// ---------- leave detection ----------
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!S.done){S.exits++;S.hideAt=Date.now();save()}else if(!document.hidden&&S&&!S.done&&S.exits)toast(T.leaveWarn)});
window.addEventListener('popstate',()=>{if(S&&!S.done){try{history.pushState(null,'',location.href)}catch(e){}}});

// ---------- boot (lock) ----------
const prev=load();
if(prev){S=prev;
  if(S.done&&S.result)resultScreen(S.result,true);
  else{ // reopened mid-review: continue (same timer), counted as an exit
    S.reopen=true;if(!S.hideAt||Date.now()-S.hideAt>15000)S.exits++;save();showQ();toast(T.leaveWarn)}
}else startScreen();
})();
</script>
</body>
