<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة الهيكل · السؤالان 15 و16 · الجهد وطاقة الوضع الكهربائية</title>
<style>
:root{--ink:#14213d;--muted:#5c6475;--line:#d6dbe4;--accent:#0b5d8f;--ok:#1e7d3a;--okbg:#e6f4ea;--bad:#b3261e;--badbg:#fdecea;--mid:#b07d00;--midbg:#fff6dc;--bg:#f4f6f9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:780px;margin:0 auto;padding:12px 16px 90px}
header{text-align:center;padding:8px 0 4px}
header .p{font-weight:bold;font-size:19px;color:var(--accent)} header .t{font-weight:bold;font-size:18px} header .k{font-size:15px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
h2{font-size:17px;margin:0 0 8px}
ol.ins{margin:0;padding-inline-start:22px} ol.ins li{margin:3px 0;font-size:15.5px}
label{display:block;font-weight:bold;margin:10px 0 4px}
input[type=tel]{width:100%;padding:11px 12px;font-size:17px;border:1px solid #9aa3b2;border-radius:8px;font-family:inherit}
button{font-family:inherit;font-size:16px;border:0;border-radius:8px;padding:11px 14px;cursor:pointer}
.btn{background:var(--accent);color:#fff;font-weight:bold}.btn.sec{background:#e8ecf2;color:var(--ink)}.btn.w{width:100%;margin-top:12px}
.err{color:var(--bad);font-weight:bold;min-height:1.4em;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.g{background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:bold;padding:9px 0;font-family:Arial,sans-serif}
.g.cur{outline:3px solid var(--accent);outline-offset:1px}.g.part{border-color:var(--accent)}
.g.s1{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.g.s2{background:var(--midbg);border-color:var(--mid);color:var(--mid)}.g.s3{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:4px;vertical-align:middle;border:2px solid}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qn{font-weight:bold;font-size:18px}
.timer{font-weight:bold;font-variant-numeric:tabular-nums;border:2px solid var(--accent);color:var(--accent);border-radius:8px;padding:1px 10px;direction:ltr;font-size:15px}
.timer.over{border-color:var(--bad);color:var(--bad)}
.qtext{margin:10px 0}
.fig{text-align:center;margin:8px 0}.fig img{max-width:100%;height:auto;max-height:240px;pointer-events:none}
.part{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.ptext{margin-bottom:6px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;text-align:start;width:100%;color:var(--ink)}
.opt .l{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #8c96a8;display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:Arial,sans-serif}
.opt.wrong{border-color:var(--bad);background:var(--badbg);opacity:.75}.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt:disabled{cursor:default}
.fb{font-weight:bold;margin-top:6px;min-height:1.4em}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.nav{display:flex;gap:8px;margin-top:14px}.nav button{flex:1}
.sum{font-size:15px;color:var(--muted)}
bdi{white-space:nowrap}
</style>

 <header><div class="p" id="hp"></div><div class="t" id="ht"></div><div class="k" id="hk"></div></header>
 <div id="app"></div>

<script>
/* Einstein Gulf physics calculator — degrees only. Exposes EGPCalc.evaluate(str) and EGPCalc.mount(opts). */
(function(root){
"use strict";
var D2R=Math.PI/180;
function lex(s){
  var t=[],i=0;
  while(i<s.length){
    var c=s[i];
    if(c===' '){i++;continue}
    if(/[0-9.]/.test(c)){
      var j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      var num=s.slice(i,j);
      if(s[j]==='E'){var k=j+1;if(s[k]==='-'||s[k]==='+')k++;var k0=k;while(k<s.length&&/[0-9]/.test(s[k]))k++;if(k===k0)throw 'syntax';num=s.slice(i,k);j=k}
      if((num.split('.').length>2)||num==='.')throw 'syntax';
      t.push({k:'n',v:parseFloat(num)});i=j;continue}
    var fn=s.slice(i).match(/^(asin|acos|atan|sin|cos|tan|sqrt|ln|log)\(/);
    if(fn){t.push({k:'f',v:fn[1]});t.push({k:'('});i+=fn[0].length;continue}
    if(s.slice(i,i+3)==='Ans'){t.push({k:'ans'});i+=3;continue}
    if(c==='π'){t.push({k:'n',v:Math.PI});i++;continue}
    if(c==='e'){t.push({k:'n',v:Math.E});i++;continue}
    if('+-*/^()²'.indexOf(c)>=0){t.push({k:c});i++;continue}
    throw 'syntax';
  }
  return t;
}
function trig(f,x){
  var r;
  if(f==='sin'||f==='cos'||f==='tan'){
    var m=((x%360)+360)%360;
    if(f==='tan'&&Math.abs(((m%180)+180)%180-90)<1e-9)throw 'math';
    var exact={0:[0,1],30:[0.5,null],90:[1,0],150:[0.5,null],180:[0,-1],210:[-0.5,null],270:[-1,0],330:[-0.5,null],60:[null,0.5],120:[null,-0.5],240:[null,-0.5],300:[null,0.5]};
    var key=Math.round(m*1e9)/1e9;
    if(exact[key]){var e=exact[key];if(f==='sin'&&e[0]!==null)return e[0];if(f==='cos'&&e[1]!==null)return e[1]}
    if(f==='tan'){if(key===0||key===180)return 0;if(key===45||key===225)return 1;if(key===135||key===315)return -1}
    r=f==='sin'?Math.sin(x*D2R):f==='cos'?Math.cos(x*D2R):Math.tan(x*D2R);
    return Math.abs(r)<1e-13?0:r;
  }
  if(f==='asin'||f==='acos'){if(x<-1-1e-12||x>1+1e-12)throw 'math';x=Math.max(-1,Math.min(1,x));return (f==='asin'?Math.asin(x):Math.acos(x))/D2R}
  if(f==='atan')return Math.atan(x)/D2R;
  if(f==='sqrt'){if(x<0)throw 'math';return Math.sqrt(x)}
  if(f==='ln'){if(x<=0)throw 'math';return Math.log(x)}
  if(f==='log'){if(x<=0)throw 'math';return Math.log10?Math.log10(x):Math.log(x)/Math.LN10}
  throw 'syntax';
}
function parse(tokens,ans){
  var p=0;
  function peek(){return tokens[p]}
  function eat(k){var t=tokens[p];if(!t||t.k!==k)throw 'syntax';p++;return t}
  function startsPrimary(t){return t&&(t.k==='n'||t.k==='f'||t.k==='('||t.k==='ans')}
  function expr(){var v=term();while(peek()&&(peek().k==='+'||peek().k==='-')){var o=tokens[p++].k;var r=term();v=o==='+'?v+r:v-r}return v}
  function term(){var v=unary();
    while(true){var t=peek();
      if(t&&(t.k==='*'||t.k==='/')){p++;var r=unary();if(t.k==='/'){if(r===0)throw 'math';v=v/r}else v=v*r}
      else if(startsPrimary(t)){v=v*power()}
      else break}
    return v}
  function unary(){var t=peek();if(t&&t.k==='-'){p++;return -unary()}if(t&&t.k==='+'){p++;return unary()}return power()}
  function power(){var b=postfix();if(peek()&&peek().k==='^'){p++;var e=unary();var r=Math.pow(b,e);if(!isFinite(r)||isNaN(r))throw 'math';return r}return b}
  function postfix(){var v=primary();while(peek()&&peek().k==='²'){p++;v=v*v}return v}
  function primary(){var t=peek();if(!t)throw 'syntax';
    if(t.k==='n'){p++;return t.v}
    if(t.k==='ans'){p++;return ans}
    if(t.k==='('){p++;var v=expr();eat(')');return v}
    if(t.k==='f'){p++;eat('(');var a=expr();eat(')');return trig(t.v,a)}
    throw 'syntax'}
  var v=expr();if(p!==tokens.length)throw 'syntax';
  if(!isFinite(v)||isNaN(v))throw 'math';
  return v;
}
function balance(s){var o=0;for(var i=0;i<s.length;i++){if(s[i]==='(')o++;else if(s[i]===')')o--}if(o<0)throw 'syntax';while(o-->0)s+=')';return s}
function evaluate(s,ans){if(!s||!s.trim())throw 'syntax';return parse(lex(balance(s)),ans||0)}
function clean(v){if(v===0)return 0;var r=Number(v.toPrecision(10));return Math.abs(r)<1e-300?0:r}
var SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function format(v){
  v=clean(v);if(v===0)return '0';
  var a=Math.abs(v);
  if(a>=1e10||a<1e-4){
    var ex=v.toExponential(9).split('e');var m=parseFloat(ex[0]).toString();var n=parseInt(ex[1],10);
    return m+' × 10'+String(n).split('').map(function(c){return SUP[c]||c}).join('');
  }
  return String(v);
}
var api={evaluate:evaluate,format:format,clean:clean};

/* ---------- UI ---------- */
var KEYS=[
 ['sin','sin(','f'],['cos','cos(','f'],['tan','tan(','f'],['√','sqrt(','f'],['x²','²','o'],
 ['sin⁻¹','asin(','f'],['cos⁻¹','acos(','f'],['tan⁻¹','atan(','f'],['xʸ','^','o'],['π','π','n'],
 ['(','(','o'],[')',')','o'],['×10ⁿ','E','o'],['DEL','DEL','c'],['AC','AC','c'],
 ['7','7','n'],['8','8','n'],['9','9','n'],['÷','/','o'],['ln','ln(','f'],
 ['4','4','n'],['5','5','n'],['6','6','n'],['×','*','o'],['log','log(','f'],
 ['1','1','n'],['2','2','n'],['3','3','n'],['−','-','o'],['Ans','Ans','n'],
 ['0','0','n'],['.','.','n'],['(−)','-','o'],['+','+','o'],['=','=','eq']
];
var SHOW={'*':'×','/':'÷','-':'−','E':'×10^','asin(':'sin⁻¹(','acos(':'cos⁻¹(','atan(':'tan⁻¹(','sqrt(':'√('};
function mount(opt){
  opt=opt||{};var lang=opt.lang||'ar';
  var L=lang==='ar'?{title:'آلة حاسبة',deg:'الزوايا بالدرجات DEG',close:'إغلاق',syn:'خطأ في كتابة العملية',math:'خطأ رياضي'}:{title:'Calculator',deg:'Angles in degrees (DEG)',close:'Close',syn:'Syntax error',math:'Math error'};
  var css='.egc-btn{position:fixed;bottom:16px;'+(lang==='ar'?'left':'right')+':16px;z-index:40;background:#14213d;color:#fff;border:0;border-radius:24px;padding:10px 16px;font:bold 15px Tahoma,Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}'+
  '.egc-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none;align-items:flex-end;justify-content:center}'+
  '.egc{background:#1d2433;color:#fff;width:100%;max-width:420px;border-radius:14px 14px 0 0;padding:12px;font-family:Arial,sans-serif;direction:ltr}'+
  '.egc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font:bold 14px Tahoma,Arial,sans-serif}.egc-h span{font-weight:normal;color:#9fb3c8;font-size:12px}'+
  '.egc-x{background:#3a4458;color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}'+
  '.egc-d{background:#e9f0e1;color:#111;border-radius:8px;padding:8px 10px;min-height:64px;margin-bottom:8px;text-align:right;overflow:hidden}'+
  '.egc-e{font-size:17px;min-height:22px;word-break:break-all}.egc-r{font-size:24px;font-weight:bold;min-height:30px}'+
  '.egc-k{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}'+
  '.egc-k button{border:0;border-radius:7px;padding:11px 0;font-size:15px;cursor:pointer;background:#3a4458;color:#fff;touch-action:manipulation}'+
  '.egc-k button.n{background:#f2f4f8;color:#111;font-weight:bold}.egc-k button.c{background:#b3261e}.egc-k button.eq{background:#1f8f4e;font-weight:bold}.egc-k button.f{background:#2b5d8a}';
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  var b=document.createElement('button');b.className='egc-btn';b.type='button';b.textContent='🧮 '+L.title;document.body.appendChild(b);
  var ov=document.createElement('div');ov.className='egc-ov';
  ov.innerHTML='<div class="egc" role="dialog" aria-label="'+L.title+'"><div class="egc-h">'+L.title+' <span>'+L.deg+'</span><button class="egc-x" type="button">'+L.close+'</button></div><div class="egc-d"><div class="egc-e"></div><div class="egc-r"></div></div><div class="egc-k"></div></div>';
  document.body.appendChild(ov);
  var toks=[],ans=0,justEval=false;
  var eEl=ov.querySelector('.egc-e'),rEl=ov.querySelector('.egc-r'),kEl=ov.querySelector('.egc-k');
  function show(){eEl.textContent=toks.map(function(t){return SHOW[t]||t}).join('')}
  KEYS.forEach(function(k){var x=document.createElement('button');x.type='button';x.textContent=k[0];x.className=k[2];
    x.onclick=function(){press(k[1])};kEl.appendChild(x)});
  function press(v){
    if(v==='AC'){toks=[];rEl.textContent='';justEval=false;show();return}
    if(v==='DEL'){toks.pop();justEval=false;show();return}
    if(v==='='){var s=toks.join('');if(!s)return;try{var r=evaluate(s,ans);ans=clean(r);rEl.textContent=format(r)}catch(e){rEl.textContent=e==='math'?L.math:L.syn}justEval=true;return}
    if(justEval){justEval=false;if(/^[0-9.(πe]|^(sin|cos|tan|asin|acos|atan|sqrt|ln|log)\($/.test(v)){toks=[];rEl.textContent=''}else if(/^[+\-*/^²E]$/.test(v)){toks=['Ans']}}
    toks.push(v);show();
  }
  b.onclick=function(){ov.style.display='flex'};
  ov.querySelector('.egc-x').onclick=function(){ov.style.display='none'};
  ov.addEventListener('click',function(e){if(e.target===ov)ov.style.display='none'});
  return {press:press,open:b.onclick};
}
api.mount=mount;
root.EGPCalc=api;
if(typeof module!=='undefined')module.exports=api;
})(typeof window!=='undefined'?window:this);

</script>

(function(){

const T=CFG.t,KEY='egp_pr_'+CFG.id,$=s=>document.querySelector(s),app=$('#app');

function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function vhash(s){let h1=0x811c9dc5,h2=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0}return((h1^h2)>>>0).toString(16).toUpperCase().padStart(8,'0').slice(0,6)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function iso0(s){return esc(s).replace(/(\(?-?[+−]?[\d.]+(?:\s?×\s?10[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)?\s?(?:kg·m²\/s|kg·m\/s|kg·m²|N·s|N·m|rev\/s|rad\/s|m\/s|km\/h|kg|cm|N|J|s|m)(?![A-Za-z])\)?|[\d.]+\s?×\s?10[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+|\b[A-Za-z]\b)/g,'<bdi dir="ltr">$1</bdi>')}
function eqf(s){return '<bdi dir="ltr" class="eqx">'+esc(s).replace(/\^\(([^)]*)\)/g,'<sup>$1</sup>')+'</bdi>'}
function iso(s){s=String(s);if(!/[\u0600-\u06FF]/.test(s))return eqf(s.replace(/[⟦⟧]/g,''));return s.split(/⟦|⟧/).map((x,k)=>k%2?eqf(x):iso0(x)).join('')}

  if(ps.every(x=>x.done)){if(ps.some(x=>x.done===3))return 's3';if(ps.some(x=>x.done===2))return 's2';return 's1'}
  if(ps.some(x=>x.done||x.tries.length))return 'part';return ''}
function stats(){let n=0,a=0,b=0,c=0;CFG.qs.forEach(q=>q.parts.forEach(p=>{n++;const x=S.parts[p.id];if(!x||!x.done)return;if(x.done===1)a++;else if(x.done===2)b++;else c++}));return {n,a,b,c}}

function gate(){

  $('#rs').onclick=()=>{if(confirm(T.resetQ)){tick&&clearInterval(tick);tick=null;S=fresh();save();cur=0;view();window.scrollTo(0,0)}};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.p,+b.dataset.o));
  if($('#bdl')){const BN='Coverage-Review-Q15-Q16-Questions.pdf';const blob=()=>{const bin=atob(BPDF);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:'application/pdf'})};const m=t=>{$('#bmsg').textContent=t};
   $('#bdl').onclick=()=>{try{const url=URL.createObjectURL(blob());const l=document.createElement('a');l.href=url;l.download=BN;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);m('بدأ التنزيل. ستجد الملف في التنزيلات (Downloads). إذا لم يظهر فجرّب الزر الثاني.')}catch(e){m('تعذّر التنزيل هنا. جرّب الزر الثاني.')}};
   $('#bsh').onclick=async()=>{try{const f=new File([blob()],BN,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:CFG.title})}else{const url=URL.createObjectURL(blob());const w=window.open(url,'_blank');if(!w)location.href=url}}catch(e){if(e&&e.name==='AbortError')return;m('افتح المراجعة من متصفح Chrome وجرّب مرة أخرى.')}};}
  const lim=q.min*60;tStart=Date.now();
  const upd=()=>{const t=(S.time[q.id]||0)+Math.round((Date.now()-tStart)/1000);const tm=$('#tm');if(!tm)return;tm.textContent=fmt(t)+' / '+fmt(lim);tm.classList.toggle('over',t>lim)};
  upd();tick=setInterval(upd,1000);
}
function choose(pid,oi){
  const q=CFG.qs[cur],p=q.parts.find(x=>x.id===pid);const x=S.parts[pid]||{tries:[],done:0};
  if(x.done||x.tries.includes(oi))return;
  x.tries.push(oi);
  if(isOk(p,oi))x.done=x.tries.length===1?1:2;else if(x.tries.length>=2)x.done=3;
  S.parts[pid]=x;save();const y=window.scrollY;stopTimer();view();window.scrollTo(0,y);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&tick)stopTimer();else if(!document.hidden&&S&&S.ok&&!tick&&app.querySelector('#tm')){view()}});
gate();
if(window.EGPCalc)EGPCalc.mount({lang:CFG.lang});
})();
</script>
