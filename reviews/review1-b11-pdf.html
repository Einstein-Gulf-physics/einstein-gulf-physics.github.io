function fnv(s){const b=new TextEncoder().encode(s);let h=0x811c9dc5;for(const x of b){h^=x;h=Math.imul(h,16777619)>>>0}return h||1}
function b64(s){const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u}
const $=id=>document.getElementById(id);let pdf=null;
function open(code){
  const d=b64(ENC);let x=fnv(SALT+'|'+code);
  for(let i=0;i<d.length;i++){x^=(x<<13)>>>0;x>>>=0;x^=x>>>17;x^=(x<<5)>>>0;x>>>=0;d[i]^=x&255}
  const B=JSON.parse(new TextDecoder().decode(d));pdf=B.pdf;
  const box=$('pages');B.pages.forEach((p,i)=>{const im=new Image();im.className='pg';im.alt='صفحة '+(i+1);im.src='data:image/jpeg;base64,'+p;box.appendChild(im)});
  $('gate').hidden=true;$('view').hidden=false;try{sessionStorage.setItem('egp_pdf_ok',code)}catch(e){}
}
$('go').onclick=()=>{const c=$('cd').value.replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,d=>d.charCodeAt(0)-0x6F0).replace(/\D/g,'');if(fnv(SALT+'|check|'+c).toString(16).padStart(8,'0')!==CHECK){$('er').textContent="الكود غير صحيح. اطلب الكود من الأستاذ رامي عبد الفتاح.";return}open(c)};
$('cd').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('dl').onclick=()=>{const blob=new Blob([b64(pdf)],{type:'application/pdf'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=NAME;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)};
})();
</script></body></html>
