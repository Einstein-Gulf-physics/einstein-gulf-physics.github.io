(function(root){
"use strict";
var D2R=Math.PI/180;
function lex(s){
  var t=[],i=0;
  while(i<s.length){
    var c=s[i];

      var j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;

    if(c==='π'){t.push({k:'n',v:Math.PI});i++;continue}
    if(c==='e'){t.push({k:'n',v:Math.E});i++;continue}

  }

}
function trig(f,x){
  var r;
  if(f==='sin'||f==='cos'||f==='tan'){
    var m=((x%360)+360)%360;
    if(f==='tan'&&Math.abs(((m%180)+180)%180-90)<1e-9)throw 'math';
    var exact={0:[0,1],30:[0.5,null],90:[1,0],150:[0.5,null],180:[0,-1],210:[-0.5,null],270:[-1,0],330:[-0.5,null],60:[null,0.5],120:[null,-0.5],240:[null,-0.5],300:[null,0.5]};

    if(exact[key]){var e=exact[key];if(f==='sin'&&e[0]!==null)return e[0];if(f==='cos'&&e[1]!==null)return e[1]}
    if(f==='tan'){if(key===0||key===180)return 0;if(key===45||key===225)return 1;if(key===135||key===315)return -1}

  if(f==='ln'){if(x<=0)throw 'math';return Math.log(x)}
  if(f==='log'){if(x<=0)throw 'math';return Math.log10?Math.log10(x):Math.log(x)/Math.LN10}
  throw 'syntax';
}
function parse(tokens,ans){
  var p=0;
  function peek(){return tokens[p]}
  function eat(k){var t=tokens[p];if(!t||t.k!==k)throw 'syntax';p++;return t}
  function startsPrimary(t){return t&&(t.k==='n'||t.k==='f'||t.k==='('||t.k==='ans')}
  function expr(){var v=term();while(peek()&&(peek().k==='+'||peek().k==='-')){var o=tokens[p++].k;var r=term();v=o==='+'?v+r:v-r}return v}
  function term(){var v=unary();
    while(true){var t=peek();
      if(t&&(t.k==='*'||t.k==='/')){p++;var r=unary();if(t.k==='/'){if(r===0)throw 'math';v=v/r}else v=v*r}
      else if(startsPrimary(t)){v=v*power()}
      else break}
    return v}
  function unary(){var t=peek();if(t&&t.k==='-'){p++;return -unary()}if(t&&t.k==='+'){p++;return unary()}return power()}
  function power(){var b=postfix();if(peek()&&peek().k==='^'){p++;var e=unary();var r=Math.pow(b,e);if(!isFinite(r)||isNaN(r))throw 'math';return r}return b}
  function postfix(){var v=primary();while(peek()&&peek().k==='²'){p++;v=v*v}return v}
  function primary(){var t=peek();if(!t)throw 'syntax';
    if(t.k==='n'){p++;return t.v}
    if(t.k==='ans'){p++;return ans}
    if(t.k==='('){p++;var v=expr();eat(')');return v}
    if(t.k==='f'){p++;eat('(');var a=expr();eat(')');return trig(t.v,a)}
    throw 'syntax'}

}
function balance(s){var o=0;for(var i=0;i<s.length;i++){if(s[i]==='(')o++;else if(s[i]===')')o--}if(o<0)throw 'syntax';while(o-->0)s+=')';return s}

(function(){
"use strict";
const T=CFG.t,KEY='egp_pr2_'+CFG.id,$=s=>document.querySelector(s),app=$('#app');
$('#hp').textContent=CFG.platform;$('#ht').textContent=CFG.title;$('#hk').textContent=CFG.track;
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function vhash(s){let h1=0x811c9dc5,h2=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0}return((h1^h2)>>>0).toString(16).toUpperCase().padStart(8,'0').slice(0,6)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function iso(s){return esc(s).replace(/(\(?-?[+−]?[\d.]+(?:\s?×\s?10[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)?\s?(?:kg·m²\/s|kg·m\/s|kg·m²|N·s|N·m|rev\/s|rad\/s|m\/s|km\/h|kg|cm|N|J|s|m)(?![A-Za-z])\)?|[\d.]+\s?×\s?10[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+|\b[A-Za-z]\b)/g,'<bdi dir="ltr">$1</bdi>')}
function isOk(p,i){return vhash(CFG.salt+'|'+p.id+'|'+p.opts[i])===p.ah}
['copy','cut','dragstart'].forEach(e=>document.addEventListener(e,ev=>{if(!(ev.target&&ev.target.tagName==='INPUT'))ev.preventDefault()}));
let S=null,cur=0,tick=null,tStart=0;
function load(){try{return JSON.parse(sget(KEY)||'null')}catch(e){return null}}
function save(){sset(KEY,JSON.stringify(S))}
function fresh(){return {ok:true,cur:0,parts:{},time:{}}}
function fmt(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
// part state: {tries:[optIdx...], done:0|1|2|3}  1=first try, 2=second try, 3=revealed
function qState(q){const ps=q.parts.map(p=>S.parts[p.id]||{tries:[],done:0});
  if(ps.every(x=>x.done)){if(ps.some(x=>x.done===3))return 's3';if(ps.some(x=>x.done===2))return 's2';return 's1'}
  if(ps.some(x=>x.done||x.tries.length))return 'part';return ''}
function stats(){let n=0,a=0,b=0,c=0;CFG.qs.forEach(q=>q.parts.forEach(p=>{n++;const x=S.parts[p.id];if(!x||!x.done)return;if(x.done===1)a++;else if(x.done===2)b++;else c++}));return {n,a,b,c}}

function gate(){
  app.innerHTML=`<div class="card"><h2>${esc(T.insTitle)}</h2><ol class="ins">${T.ins.map(x=>'<li>'+iso(x)+'</li>').join('')}</ol>
  <label for="cd">${esc(T.code)}</label><input id="cd" type="tel" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="${esc(T.codePh)}">
  <div class="err" id="er"></div><button class="btn w" id="go">${esc(T.start)}</button></div>`;
  const go=()=>{const c=$('#cd').value.trim();if(vhash(CFG.salt+'|code|'+c)!==CFG.codeH){$('#er').textContent=T.badCode;return}
    S=load()||fresh();S.ok=true;save();cur=S.cur||0;view()};
  $('#go').onclick=go;$('#cd').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
function stopTimer(){if(tick){clearInterval(tick);tick=null;const q=CFG.qs[cur];S.time[q.id]=(S.time[q.id]||0)+Math.round((Date.now()-tStart)/1000);save()}}
function view(){
  stopTimer();S.cur=cur;save();
  const q=CFG.qs[cur],st=stats(),L='ABCD';
  const grid=CFG.qs.map((x,i)=>`<button class="g ${qState(x)} ${i===cur?'cur':''}" data-i="${i}">${i+1}</button>`).join('');
  app.innerHTML=`<div class="card"><div class="grid">${grid}</div>
   <div class="legend"><span><i style="border-color:var(--ok);background:var(--okbg)"></i>${esc(T.lg1)}</span><span><i style="border-color:var(--mid);background:var(--midbg)"></i>${esc(T.lg2)}</span><span><i style="border-color:var(--bad);background:var(--badbg)"></i>${esc(T.lg3)}</span><span><i style="border-color:var(--accent)"></i>${esc(T.lg4)}</span></div>
   <div class="sum">${esc(T.prog.replace('{a}',st.a).replace('{b}',st.b).replace('{c}',st.c).replace('{n}',st.n))}</div></div>
   <div class="card"><div class="bar"><span class="qn">${esc(T.q)} ${cur+1} <span class="sum">/ ${CFG.qs.length}</span></span>
   <span class="timer" id="tm"></span></div>
   <div class="sum">${esc(T.sug.replace('{m}',q.min))}</div>
   <div class="qtext">${iso(q.text)}</div>${q.img?`<div class="fig"><img src="${q.img}" alt=""></div>`:''}
   ${q.parts.map(p=>{const x=S.parts[p.id]||{tries:[],done:0};let fb='';
     if(x.done===1||x.done===2)fb=`<div class="fb ok">✓ ${esc(T.right)}</div>`;else if(x.done===3)fb=`<div class="fb bad">✗ ${esc(T.wrongFinal)}</div>`;else if(x.tries.length===1)fb=`<div class="fb bad">✗ ${esc(T.wrongAgain)}</div>`;
     const corr=x.done===3?p.opts.findIndex((o,i)=>isOk(p,i)):-1;
     return `<div class="part"><div class="ptext">${p.label?'<b>'+esc(p.label)+'</b> ':''}${iso(p.text)}</div><div class="opts">${p.order.map((oi,k)=>{
       let cls=x.tries.includes(oi)?(isOk(p,oi)?'right':'wrong'):'';if(oi===corr)cls='right';
       const dis=x.done||x.tries.includes(oi)?'disabled':'';
       return `<button class="opt ${cls}" data-p="${p.id}" data-o="${oi}" ${dis}><span class="l">${L[k]}</span><span>${iso(p.opts[oi])}</span></button>`}).join('')}</div>${fb}</div>`}).join('')}
   <div class="nav"><button class="btn sec" id="pv" ${cur===0?'disabled':''}>${esc(T.prev)}</button><button class="btn" id="nx" ${cur===CFG.qs.length-1?'disabled':''}>${esc(T.next)}</button></div></div>
   <div class="card"><button class="btn sec w" id="rs" style="margin-top:0">${esc(T.reset)}</button></div>`;
  app.querySelectorAll('.g').forEach(b=>b.onclick=()=>{stopTimer();cur=+b.dataset.i;view();window.scrollTo(0,0)});
  $('#pv').onclick=()=>{if(cur>0){stopTimer();cur--;view();window.scrollTo(0,0)}};
  $('#nx').onclick=()=>{if(cur<CFG.qs.length-1){stopTimer();cur++;view();window.scrollTo(0,0)}};
  $('#rs').onclick=()=>{if(confirm(T.resetQ)){tick&&clearInterval(tick);tick=null;S=fresh();save();cur=0;view();window.scrollTo(0,0)}};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.p,+b.dataset.o));
  const lim=q.min*60;tStart=Date.now();
  const upd=()=>{const t=(S.time[q.id]||0)+Math.round((Date.now()-tStart)/1000);const tm=$('#tm');if(!tm)return;tm.textContent=fmt(t)+' / '+fmt(lim);tm.classList.toggle('over',t>lim)};
  upd();tick=setInterval(upd,1000);
}
function choose(pid,oi){
  const q=CFG.qs[cur],p=q.parts.find(x=>x.id===pid);const x=S.parts[pid]||{tries:[],done:0};
  if(x.done||x.tries.includes(oi))return;
  x.tries.push(oi);
  if(isOk(p,oi))x.done=x.tries.length===1?1:2;else if(x.tries.length>=2)x.done=3;
  S.parts[pid]=x;save();const y=window.scrollY;stopTimer();view();window.scrollTo(0,y);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&tick)stopTimer();else if(!document.hidden&&S&&S.ok&&!tick&&app.querySelector('#tm')){view()}});
gate();
if(window.EGPCalc)EGPCalc.mount({lang:CFG.lang});
})();
</script>
<script id="egFold">
(function(){
var en=(document.documentElement.lang||'').indexOf('en')===0,KEEP=3;
function fold(){document.querySelectorAll('ol').forEach(function(ol){
  if(ol.dataset.fold)return;var li=ol.querySelectorAll(':scope>li');if(li.length<=KEEP+1)return;
  ol.dataset.fold='1';for(var i=KEEP;i<li.length;i++)li[i].hidden=true;
  var b=document.createElement('button');b.type='button';b.className='egfold';
  b.textContent=en?'Show all instructions ('+li.length+')':'عرض باقي التعليمات ('+(li.length-KEEP)+')';
  b.onclick=function(){for(var i=KEEP;i<li.length;i++)li[i].hidden=false;b.remove()};
  ol.after(b)})}
var st=document.createElement('style');st.textContent='.egfold{font:inherit;font-weight:700;font-size:.92rem;background:none;border:1.5px solid #c9d3e6;color:#1f5fae;border-radius:8px;padding:8px 14px;margin:2px 0 6px;cursor:pointer;align-self:flex-start}';document.head.appendChild(st);
fold();new MutationObserver(fold).observe(document.body,{childList:true,subtree:true});
})();
</script>
